name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Monitor Budapest sources]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and contracts
        run: node --test tests/*.test.cjs
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html style.css app.js api.js social.js editor.js i18n.js config.js content-model.js exhibitions.json monitor.js notifications.js monitor-sources.json monitor-feed.json platform.js places.json _site/
          printf '[]\n' > _site/content.json
          printf '[]\n' > _site/pending-stories.json
          cp -R assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
