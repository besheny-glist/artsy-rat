name: Monitor Budapest sources
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector contracts
        run: python3 -m unittest discover -s tests -p 'test_monitor.py'
      - name: Read public sources
        run: python3 scripts/monitor_sources.py
      - name: Save discovery inbox
        run: |
          git config user.name 'ARTsyRAT source monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Budapest editorial discoveries'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
