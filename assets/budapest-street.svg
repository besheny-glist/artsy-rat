<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760"><title>Budapest street with a two-car number 56 tram</title><style>
.tram{animation:tram-trip 30s cubic-bezier(.45,0,.2,1) infinite}
@keyframes tram-trip{0%,6%{transform:translateX(-410px)}26%,55%{transform:translateX(30px)}82%,100%{transform:translateX(560px)}}
.tram-door{transform-box:fill-box;transform-origin:right;animation:door-trip 30s infinite}
@keyframes door-trip{0%,27%,51%,100%{transform:scaleX(1)}31%,47%{transform:scaleX(.12)}}
.boarder{animation:boarding 30s infinite}.boarder.two{animation-name:boarding-two}.boarder.three{animation-name:boarding-three}
@keyframes boarding{0%,32%{opacity:1;transform:translate(0,0)}40%,88%{opacity:0;transform:translate(-22px,-35px)}89%,100%{opacity:1;transform:translate(0,0)}}
@keyframes boarding-two{0%,37%{opacity:1;transform:translate(0,0)}45%,90%{opacity:0;transform:translate(-42px,-35px)}91%,100%{opacity:1;transform:translate(0,0)}}
@keyframes boarding-three{0%,41%{opacity:1;transform:translate(0,0)}49%,92%{opacity:0;transform:translate(-62px,-35px)}93%,100%{opacity:1;transform:translate(0,0)}}
.new-rider{animation:rider-trip 30s infinite}
@keyframes rider-trip{0%,38%,99%,100%{opacity:0}48%,95%{opacity:.65}}
@media(prefers-reduced-motion:reduce){.tram{animation:none;transform:translateX(30px)}.boarder,.tram-door,.new-rider{animation:none}}
